name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, to catch changes on the scraped site.
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  hub:
    uses: blackdiamondlodge/bdh-sdk/.github/workflows/app-ci.yml@bc516bc93fd3f36066881f2a350294c1ea6e5330
    with:
      app_id: sunpeaks_webcams
      stack_e2e: true
